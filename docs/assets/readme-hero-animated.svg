  <style>
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(60px, 24px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-50px, -20px); } }
    .auroraA { animation: driftA 16s ease-in-out infinite alternate; }
    .auroraB { animation: driftB 19s ease-in-out infinite alternate; }
    @keyframes metricPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }
    .metric { animation: metricPulse 8s ease-in-out infinite; }
    @keyframes markStep { 0%, 10% { transform: translate(0,0); } 14% { transform: translate(0,-24px); } 18%, 100% { transform: translate(0,0); } }
    .mark { animation: markStep 8s ease-out infinite; }
    @keyframes btnPress { 0%, 10% { transform: scale(1); } 13% { transform: scale(0.94); } 17%, 100% { transform: scale(1); } }
    .btn { transform-box: fill-box; transform-origin: center; animation: btnPress 8s cubic-bezier(.2,1.4,.4,1) infinite; }
    .sys { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

