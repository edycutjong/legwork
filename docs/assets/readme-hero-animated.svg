<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Legwork — one transaction splits the order's ink deposit: payment to the payee, exact copper gas back to whoever ran it">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: plate, mark, wordmark, tagline, metric line, tech line; the receipt card on the right shows Order #5 DUE with its deposit line whole
  10-25%  trigger:      "Execute — anyone" is pressed: a copper ring pulses from the button                    data-story="beat-2"
  25-55%  mechanism:    One transaction splits the order's ink deposit: payment to the payee, exact copper gas back to whoever ran it.   data-story="beat-3"
  55-80%  resolution:   the receipt's lines reveal: metered 58,415 · used 58,415 · drift 0 · net = tip; the copper packet has landed on the executor and stays   data-story="beat-4"
  80-100% breathe + seam fade (the story layer fades 96–100 % and in 0–2 %)
-->
