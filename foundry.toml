[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
no_match_coverage = "(test/|Rejector)"   # coverage is measured on Legwork.sol: the tests are not the product, and Rejector's one statement is a bare revert() that solc merges with the dispatcher revert, so its anchor can never register a hit although three tests exercise it
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
